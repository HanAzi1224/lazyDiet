name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: 161363670536.dkr.ecr.ap-northeast-2.amazonaws.com/lazy_diet
  ENV_S3_PATH: s3://hn3ehn-env/lazyDiet/.env
  EC2_HOST: 3.39.231.52
  EC2_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: lazyDietVar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch .env from S3
        run: aws s3 cp "$ENV_S3_PATH" ./.env

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Write SSH key
        run: |
          umask 077
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > deploy_key.pem
          chmod 400 deploy_key.pem

      - name: Copy deploy files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i deploy_key.pem \
            docker-compose-prod.yml scripts/deploy-stage.sh scripts/custom.conf \
            "$EC2_USER@$EC2_HOST":/home/ubuntu

      - name: Run remote deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i deploy_key.pem "$EC2_USER@$EC2_HOST" '
            aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" &&
            aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" &&
            aws configure set region "'"$AWS_REGION"'" &&
            bash -e deploy-stage.sh
          '

      - name: Clean up SSH key
        if: always()
        run: rm -f deploy_key.pem
